<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>
</head>
<body>
    <h1>Clients</h1>
    <a href="{% url 'addclient' %}">Add Client</a>
    <ul>
        {% for client in clients %}
            <li>
                <a href="{% url 'clientdetail' client.id %}">{{ client.name }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
